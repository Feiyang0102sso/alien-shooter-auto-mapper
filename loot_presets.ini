; Auto Mapper loot presets (UTF-8). Shared by every Loot Box card, told apart by section name.
; itemN = whole loot text written into the container's nameText; the game picks one item of it
;   (a repeated name weighs more, EMPTY drops nothing).
; itemN_p = chance a container gets this line; the rest of 100% leaves the container empty.
;
; Built-in templates from the original maps, limited to money (no gold bar Obj_money4), ammo and HP pickups.
; Box stages use the commonest official wood / metal box lines, scaled so the empty share matches the maps.

